name = "hoantiendv-accesstrade-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Two independent schedules on the SAME Worker, told apart inside
# scheduled() by event.cron:
#   */5 * * * *  (existing) -> pollOrders() — order-list sync.
#   0 * * * *    (new)      -> rebuildDatafeedIndex() — refreshes the D1
#                              Shopee price/name/image index from
#                              ACCESSTRADE's static datafeed CSV. Hourly
#                              is a deliberate, conservative starting
#                              point — the CSV itself has no documented
#                              update frequency; this can be tightened or
#                              loosened later without touching the lookup
#                              side (lookupDatafeedProduct) at all.
[triggers]
crons = ["*/5 * * * *", "0 * * * *"]

# D1 index for Shopee product price/name/image, keyed by "<shopId>_<itemId>"
# — replaces lookupDatafeedProduct()'s old per-request CSV download+scan
# (measured live 2026-09-11: up to ~4s on a miss) with a single indexed
# lookup (see src/index.js's rebuildDatafeedIndex/lookupDatafeedProduct).
# Populated by the new hourly cron above, never written to from the
# customer-facing /create-link request path.
[[d1_databases]]
binding = "DATAFEED_DB"
database_name = "hoantiendv-datafeed-index"
database_id = "5346a45a-1c96-44d4-b3b4-15a6276e3b85"

[vars]
FIREBASE_PROJECT_ID = "hoantiendv"
# Not actually sensitive — the SAME value already ships public in the web
# bundle as NEXT_PUBLIC_TELEGRAM_CHAT_ID (a Telegram group id, not a
# credential). Only the bot TOKEN below needs to be a real secret.
TELEGRAM_CHAT_ID = "-1004411327315"

# Safety switch (see src/index.js) — "true" (default; keep it this way
# until a real conversion has been inspected via `wrangler tail` and the
# sub_id1 mapping confirmed correct by eye) makes the scheduled sync ONLY
# log what it would create/update, with ZERO Firestore writes. Flip to
# "false" only after that manual verification — never guess this open.
DRY_RUN = "true"

# ACCESSTRADE campaign_id / merchant per platform — NOT secret (confirmed
# by the account owner as safe to store as plain config, same as
# merchant/campaign_id already are throughout ACCESSTRADE's own docs).
# Real, account-specific values from the Publisher dashboard.
ACCESSTRADE_CAMPAIGN_SHOPEE = "4751584435713464237"
ACCESSTRADE_MERCHANT_SHOPEE = "shopee"
# TikTok Shop's create_link v2 (see docs) takes product_url/product_id
# directly, no campaign_id in that call — campaign id stored here anyway
# for reference/future use (e.g. a product-search feature), merchant is
# what order-list/order-products actually need.
ACCESSTRADE_CAMPAIGN_TIKTOKSHOP = "6648523843406889655"
ACCESSTRADE_MERCHANT_TIKTOKSHOP = "tiktokshop"
# Lazada — campaign approved 2026-09-07, now enabled below alongside
# Shopee/TikTok Shop.
ACCESSTRADE_CAMPAIGN_LAZADA = "5087153089503673507"
ACCESSTRADE_MERCHANT_LAZADA = "lazada"

# The ONE switch controlling which platforms actually run (link creation
# AND order sync) — deliberately separate from whether campaign_id/
# merchant above are filled in. Comma-separated, no spaces needed
# (isPlatformEnabled trims them anyway).
ACCESSTRADE_ENABLED_PLATFORMS = "SHOPEE,TIKTOK_SHOP,LAZADA"

# Secrets (never put these here — set via `wrangler secret put <NAME>`):
#   ACCESSTRADE_API_KEY   the Publisher API Access Key from your ACCESSTRADE account
#   FIREBASE_API_KEY      same as apps/web's NEXT_PUBLIC_FIREBASE_API_KEY
#   BOT_EMAIL             email of a DEDICATED (not isPaymentBot) Firebase Auth
#                         account for this Worker — create a new one, do not
#                         reuse the Telegram bot's account (see firestore.rules'
#                         isConversionBot() comment for why they must differ)
#   BOT_PASSWORD          password of that same account
#   TELEGRAM_BOT_TOKEN    same bot token as apps/web's NEXT_PUBLIC_TELEGRAM_BOT_TOKEN
#                         (only used to send the "Đơn hàng mới" message to
#                         topic 33 — this Worker never receives webhooks,
#                         workers/telegram-bot still owns that)
