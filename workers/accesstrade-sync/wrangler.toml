name = "hoantiendv-accesstrade-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Every 5 minutes -> 12 requests/hour to /v1/order-list per configured
# merchant, far under ACCESSTRADE's documented 10 requests/minute limit
# (and that endpoint's own response is cached 1 minute on their side
# anyway, so anything faster than that buys nothing).
[triggers]
crons = ["*/5 * * * *"]

[vars]
FIREBASE_PROJECT_ID = "hoantiendv"
# Not actually sensitive — the SAME value already ships public in the web
# bundle as NEXT_PUBLIC_TELEGRAM_CHAT_ID (a Telegram group id, not a
# credential). Only the bot TOKEN below needs to be a real secret.
TELEGRAM_CHAT_ID = "-1004411327315"

# Safety switch (see src/index.js) — "true" (default; keep it this way
# until a real conversion has been inspected via `wrangler tail` and the
# sub_id1 mapping confirmed correct by eye) makes the scheduled sync ONLY
# log what it would create/update, with ZERO Firestore writes. Flip to
# "false" only after that manual verification — never guess this open.
DRY_RUN = "true"

# ACCESSTRADE campaign_id / merchant per platform — NOT secret, but left
# blank on purpose: these are account-specific values only visible in your
# own ACCESSTRADE Publisher dashboard (not in the API docs), and a platform
# with a blank value here is skipped entirely (both link creation and order
# sync) rather than guessed. Fill in once Shopee/Lazada are approved and
# you've confirmed the exact values.
ACCESSTRADE_CAMPAIGN_SHOPEE = ""
ACCESSTRADE_MERCHANT_SHOPEE = ""
ACCESSTRADE_CAMPAIGN_LAZADA = ""
ACCESSTRADE_MERCHANT_LAZADA = ""
# TikTok Shop's create_link v2 (see docs) takes product_url/product_id
# directly, no campaign_id — only the merchant code is needed for order
# sync (/v1/order-list, /v1/order-products).
ACCESSTRADE_MERCHANT_TIKTOKSHOP = ""

# Secrets (never put these here — set via `wrangler secret put <NAME>`):
#   ACCESSTRADE_API_KEY   the Publisher API Access Key from your ACCESSTRADE account
#   FIREBASE_API_KEY      same as apps/web's NEXT_PUBLIC_FIREBASE_API_KEY
#   BOT_EMAIL             email of a DEDICATED (not isPaymentBot) Firebase Auth
#                         account for this Worker — create a new one, do not
#                         reuse the Telegram bot's account (see firestore.rules'
#                         isConversionBot() comment for why they must differ)
#   BOT_PASSWORD          password of that same account
#   TELEGRAM_BOT_TOKEN    same bot token as apps/web's NEXT_PUBLIC_TELEGRAM_BOT_TOKEN
#                         (only used to send the "Đơn hàng mới" message to
#                         topic 33 — this Worker never receives webhooks,
#                         workers/telegram-bot still owns that)
